name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form as completely as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Create file with content '...'
        2. Run command '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Describe what should have happened...
    validations:
      required: true

  - type: textarea
    id: stxscript-code
    attributes:
      label: StxScript Code
      description: The StxScript code that causes the issue
      render: typescript
      placeholder: |
        let example: uint = 42u;
        // Add your problematic code here
    validations:
      required: false

  - type: textarea
    id: error-output
    attributes:
      label: Error Output
      description: The complete error message or unexpected output
      render: shell
      placeholder: |
        Error transpiling file.stx: ...
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of StxScript is affected?
      options:
        - CLI
        - Python API
        - Grammar/Parser
        - Transpiler/Code Generation
        - Type System
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: StxScript Version
      description: What version of StxScript are you using?
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: What version of Python are you using?
      placeholder: "3.9.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      placeholder: "Ubuntu 20.04, macOS 12.0, Windows 11"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: Any additional information that might be helpful...
    validations:
      required: false